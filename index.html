<style>
:root{
  --ink:#75454F;
  --ink-soft:#9A6874;
  --terra:#C86F53;
  --ochre:#B8862C;
  --cream:#FBF6EF;
  --beige:#E9DEC9;
  --beige-line:#D9C9B5;
  --paper:#FFFFFF;
  --line:#E8DCD7;
  --line-soft:#F3EAE6;
  --muted:#8E7D80;
  --shadow:0 1px 2px rgba(117,69,79,.06), 0 8px 24px -14px rgba(117,69,79,.28);
  --radius:14px;
  --slot:44px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ---------- topo ---------- */
.topbar{
  background:var(--beige);
  color:var(--ink);
  padding:10px 18px;
  border-bottom:1px solid var(--beige-line);
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:40;
}
.topbar img{height:72px;width:auto;display:block}
@media (max-width:620px){ .topbar img{height:60px} }
.topbar .spacer{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:rgba(117,69,79,.08);color:var(--ink);transition:background .15s;
}
.icon-btn:hover{background:rgba(117,69,79,.16)}
.icon-btn.on{background:var(--terra);color:#fff}
.icon-btn svg{width:20px;height:20px}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 120px;
  display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:880px){ .wrap{grid-template-columns:1fr;padding:14px 12px 120px} }

.mainnav{max-width:1120px;margin:0 auto;padding:16px 16px 0}
.segs{display:inline-flex;gap:3px;background:var(--line-soft);border-radius:13px;padding:4px}
.seg{padding:9px 20px;border-radius:10px;font-family:Quicksand,sans-serif;font-weight:700;
  font-size:14.5px;color:var(--muted);transition:.14s}
.seg[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(117,69,79,.16)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.card-h h2{margin:0;font-family:Quicksand,sans-serif;font-weight:700;font-size:16px;letter-spacing:.2px}
.card-h .spacer{flex:1}

/* ---------- calendário ---------- */
.mini{padding:12px 14px 16px}
.mini-nav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.mini-nav .m{flex:1;text-align:center;font-family:Quicksand,sans-serif;font-weight:700;font-size:15px;text-transform:capitalize}
.nav-b{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-soft)}
.nav-b:hover{background:var(--line-soft)}
.nav-b svg{width:16px;height:16px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dow span{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{
  aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:13px;font-variant-numeric:tabular-nums;
  color:var(--ink);transition:background .12s;position:relative;
}
.day:hover{background:var(--line-soft)}
.day.out{color:#CBBDBF}
.day.today{box-shadow:inset 0 0 0 1.5px var(--terra);font-weight:600}
.day.sel{background:var(--ink);color:var(--cream)}
.day.sel.today{box-shadow:inset 0 0 0 1.5px var(--terra)}
.dots{display:flex;gap:3px;height:5px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.day.sel .dots i{box-shadow:0 0 0 1px rgba(255,255,255,.5)}

/* ---------- pessoas ---------- */
.peoplebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.peoplebar .lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-right:2px}
.person{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--paper);text-align:left;transition:.14s;
}
.person:hover{border-color:var(--ink-soft)}
.person .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-family:Quicksand,sans-serif;font-weight:700;font-size:11px;flex:none}
.person .nm{font-weight:500;font-size:14px}
.person .ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.person[aria-pressed="false"]{opacity:.42}
.person[aria-pressed="false"] .av{filter:grayscale(1)}

.note{padding:0 14px 14px;font-size:11.5px;line-height:1.5;color:var(--muted)}

/* ---------- dia ---------- */
.dayhead{display:flex;align-items:baseline;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.dayhead .d1{font-family:Quicksand,sans-serif;font-weight:700;font-size:19px;text-transform:capitalize}
.dayhead .d2{font-size:13px;color:var(--muted)}
.dayhead .spacer{flex:1}
.ghost{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-soft);background:var(--paper)}
.ghost:hover{border-color:var(--ink-soft);background:var(--cream)}

.tt-wrap{display:block;max-width:1120px}
@media (max-width:620px){ .seg{padding:8px 12px;font-size:13px} }

/* ---------- aniversários ---------- */
.bdband{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:rgba(200,111,83,.07);
  border-bottom:1px solid var(--line-soft)}
.bdpill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid rgba(200,111,83,.4);
  color:var(--terra);border-radius:999px;padding:4px 12px 4px 9px;font-size:13px;font-weight:600}
.bdpill svg{width:14px;height:14px;flex:none}
.bdpill span{color:var(--muted);font-weight:500}
.wband{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line);padding:4px 3px;
  display:flex;flex-direction:column;gap:3px;min-height:26px}
.wband.gut{position:sticky;left:0;z-index:5;background:var(--paper);font-size:10px;color:var(--muted);
  align-items:flex-end;justify-content:center;padding-right:7px}
.wband small{background:rgba(200,111,83,.13);color:var(--terra);border-radius:6px;padding:2px 5px;
  font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .cake{position:absolute;top:3px;right:3px;width:11px;height:11px;color:var(--terra)}
.day.sel .cake{opacity:.9}

.bdfilter{padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.bdfilter .opt i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
.day .cake{transition:none}
.bdtag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:1px 8px;margin-left:7px;
  vertical-align:1px;white-space:nowrap}
.bdrow{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line-soft);
  width:100%;text-align:left;transition:background .13s}
.bdrow:hover{background:var(--cream)}
.bdrow:last-child{border-bottom:none}
.bdrow .dt{width:52px;flex:none;text-align:center}
.bdrow .dt b{display:block;font-family:Quicksand,sans-serif;font-weight:700;font-size:19px;line-height:1;color:inherit}
.bdrow .dt small{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bdrow .who2{flex:1;min-width:0}
.bdrow .who2 b{display:block;font-weight:600;font-size:15px}
.bdrow .who2 small{color:var(--muted);font-size:12.5px}
.bdrow .cd{font-size:12px;font-weight:600;color:var(--terra);background:rgba(200,111,83,.11);
  border-radius:999px;padding:4px 10px;white-space:nowrap}
.bdrow .cd.soon{background:var(--terra);color:#fff}
.ttchips{display:flex;gap:6px;flex-wrap:wrap}
.ttchips button{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:500;transition:.13s}
.ttchips button i{width:19px;height:19px;border-radius:50%;color:#fff;font-style:normal;
  font-family:Quicksand,sans-serif;font-weight:700;font-size:10px;display:grid;place-items:center}
.ttchips button[aria-pressed="false"]{opacity:.4}
.hidden{display:none !important}

.tabs{display:flex;gap:2px;background:var(--line-soft);border-radius:11px;padding:3px}
.tab{padding:6px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);
  font-family:Quicksand,sans-serif;transition:.13s}
.tab[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(117,69,79,.14)}

/* ---------- semana (horário escolar) ---------- */
.weekscroll{overflow:auto;max-height:min(66vh,640px);position:relative;overscroll-behavior:contain}
.wgrid{display:grid;grid-template-columns:50px repeat(7,minmax(92px,1fr));min-width:690px}
.wh{position:sticky;top:0;z-index:6;background:var(--paper);border-bottom:1px solid var(--line);
  padding:9px 4px 8px;text-align:center;cursor:pointer;transition:background .13s}
.wh:hover{background:var(--cream)}
.wh .wd{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wh .wn{font-family:Quicksand,sans-serif;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;
  width:28px;height:28px;line-height:28px;margin:2px auto 0;border-radius:50%}
.wh.wtoday .wn{background:var(--terra);color:#fff}
.wh.wsel .wn{box-shadow:inset 0 0 0 1.5px var(--ink)}
.wh.wend{background:var(--cream)}
.wh.corner{position:sticky;left:0;z-index:8;cursor:default;border-right:1px solid var(--line-soft)}
.wh.corner:hover{background:var(--paper)}
.wgut{position:sticky;left:0;z-index:5;background:var(--paper);border-right:1px solid var(--line-soft);position:relative}
.wgut span{position:absolute;right:7px;transform:translateY(-6px);font-size:11px;font-weight:600;
  color:var(--muted);font-variant-numeric:tabular-nums}
.wcol{position:relative;border-right:1px solid var(--line-soft);cursor:pointer;
  background-image:
    repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 60px),
    repeating-linear-gradient(to bottom,transparent 0 30px,var(--line-soft) 30px 31px,transparent 31px 60px);
  background-position:0 0,0 0}
.wcol.wend{background-color:rgba(200,111,83,.035)}
.wcol.wselcol{background-color:rgba(117,69,79,.045)}
.wev{position:absolute;left:2px;right:3px;border-radius:8px;overflow:hidden;display:flex;
  background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 2px rgba(117,69,79,.08);
  text-align:left;transition:transform .1s}
.wev:hover{transform:translateY(-1px);z-index:4;box-shadow:0 4px 12px -5px rgba(117,69,79,.4)}
.wev .spine{width:4px;flex:none}
.wev .wb{padding:3px 5px;min-width:0;overflow:hidden;line-height:1.25}
.wev .wt{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:block}
.wev .wn2{font-size:11.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wev.done{background:var(--cream)}
.wev.done .wn2{text-decoration:line-through;color:var(--muted)}
.wnow{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--terra);z-index:3;pointer-events:none}

.scroller{position:relative;max-height:min(62vh,620px);overflow-y:auto;overscroll-behavior:contain}
.rail{position:relative;padding:16px 14px 14px 66px}
.slots{position:relative}
.slot{height:var(--slot);position:relative;cursor:pointer}
.slot::after{content:"";position:absolute;left:0;right:0;top:0;border-top:1px solid var(--line-soft)}
.slot.hour::after{border-top:1px solid var(--line)}
.slot:hover{background:rgba(200,111,83,.045)}
.tick{position:absolute;left:-52px;top:-8px;width:44px;text-align:right;
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:.02em}
.tick.hour{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
/* bigodes: as marcas da meia-hora */
.whisker{position:absolute;left:-14px;top:-1px;width:9px;border-top:1.5px solid var(--line);border-radius:2px}

.now{position:absolute;left:-8px;right:0;height:0;border-top:1.5px solid var(--terra);z-index:5;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--terra)}

.events{position:absolute;inset:0;pointer-events:none}
.ev{
  position:absolute;pointer-events:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:11px;overflow:hidden;
  display:flex;text-align:left;box-shadow:0 1px 2px rgba(117,69,79,.07);
  transition:transform .1s, box-shadow .1s;
}
.ev:hover{transform:translateY(-1px);box-shadow:0 4px 14px -6px rgba(117,69,79,.35);z-index:6}
.ev .spine{width:6px;flex:none}
.ev .body{padding:5px 9px;min-width:0;flex:1;display:flex;flex-direction:column;gap:1px;justify-content:center}
.ev .t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:5px;align-items:center}
.ev .t svg{width:11px;height:11px;opacity:.75}
.ev .n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .who{display:flex;gap:3px;margin-top:1px}
.ev .who i{width:15px;height:15px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;
  font-family:Quicksand,sans-serif;display:grid;place-items:center;font-style:normal}
.ev.short .body{padding:2px 9px}
.ev.short .who{display:none}
.ev.done{background:var(--cream)}
.ev.done .n{text-decoration:line-through;color:var(--muted)}
.ev.done .spine{opacity:.35}

.empty{padding:18px 20px 4px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;font-family:Quicksand,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin-bottom:4px}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:45;
  background:var(--terra);color:#fff;border-radius:16px;padding:14px 20px;
  font-family:Quicksand,sans-serif;font-weight:700;font-size:15px;
  display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px -8px rgba(200,111,83,.7);
}
.fab:hover{background:#B85E43}
.fab svg{width:18px;height:18px}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(117,69,79,.42);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.veil[hidden]{display:none}
@media (min-width:700px){.veil{align-items:center;padding:24px}}
.sheet{
  background:var(--paper);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:6px 18px 26px;
}
@media (min-width:700px){.sheet{border-radius:18px;padding:6px 24px 26px}}
.sheet-h{position:sticky;top:0;background:var(--paper);padding:14px 0 12px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet-h h3{margin:0;font-family:Quicksand,sans-serif;font-weight:700;font-size:18px;flex:1}
.x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--line-soft)}
.x svg{width:18px;height:18px}

.f{margin-bottom:15px}
.f>label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.in{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--cream);
  font-size:15px;transition:border-color .13s}
.in:focus{outline:none;border-color:var(--ink-soft);background:var(--paper)}
textarea.in{resize:vertical;min-height:64px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 145px;min-width:0}
.in{min-width:0;-webkit-appearance:none;appearance:none}
input.in[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
select.in{background-image:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--paper);font-size:14px;font-weight:500;transition:.13s;
}
.chip .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-family:Quicksand,sans-serif;font-weight:700;font-size:11px;opacity:.35;transition:.13s}
.chip[aria-pressed="true"] .av{opacity:1}
.chip:hover{border-color:var(--ink-soft)}

.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:8px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);
  font-size:13.5px;font-weight:500;transition:.13s}
.opt:hover{border-color:var(--ink-soft)}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.dayp{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dayp .opt{padding:8px 0;text-align:center;font-size:12px}

.alert-opt{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--paper);width:100%;text-align:left;font-size:14px;transition:.13s;margin-bottom:7px}
.alert-opt .bx{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;transition:.13s}
.alert-opt .bx svg{width:12px;height:12px;color:#fff;opacity:0}
.alert-opt[aria-pressed="true"]{border-color:var(--ink-soft)}
.alert-opt[aria-pressed="true"] .bx{background:var(--ink-soft);border-color:var(--ink-soft)}
.alert-opt[aria-pressed="true"] .bx svg{opacity:1}
.alert-opt small{color:var(--muted);font-size:12px}

.actions{display:flex;gap:10px;margin-top:22px}
.save{flex:1;background:var(--ink);color:var(--cream);border-radius:13px;padding:14px;
  font-family:Quicksand,sans-serif;font-weight:700;font-size:15.5px}
.save:hover{background:#5E3540}
.del{border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;color:var(--terra);font-weight:600;font-size:14px}
.del:hover{border-color:var(--terra);background:rgba(200,111,83,.06)}
.hidden{display:none !important}

/* ---------- toasts ---------- */
.toasts{position:fixed;top:14px;left:0;right:0;z-index:80;display:flex;flex-direction:column;
  align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{
  background:var(--ink);color:var(--cream);border-radius:14px;padding:12px 16px;max-width:400px;width:100%;
  box-shadow:0 14px 34px -12px rgba(117,69,79,.7);display:flex;gap:11px;align-items:flex-start;
  animation:pop .28s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto;
}
@keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.toast .ic{width:26px;height:26px;border-radius:9px;background:var(--terra);display:grid;place-items:center;flex:none}
.toast .ic svg{width:14px;height:14px;color:#fff}
.toast b{display:block;font-family:Quicksand,sans-serif;font-size:14.5px;font-weight:700}
.toast small{opacity:.8;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px;border-radius:6px}
</style>
</head>

const birthdays = () => tasks.filter(t => t.kind === 'birthday');
function bdaysOn(date){
  const d = parseYmd(date);
  return birthdays().filter(b => b.month === d.getMonth()+1 && b.day === d.getDate());
}
function ageOn(b, year){ return b.year ? year - b.year : null; }
function nextBday(b){
  const now = new Date(); now.setHours(0,0,0,0);
  let y = now.getFullYear();
  let d = new Date(y, b.month-1, b.day);
  if (d < now) d = new Date(++y, b.month-1, b.day);
  return { date:d, year:y, days: Math.round((d - now)/86400000) };
}

/* ============ armazenamento (Supabase, com cópia local para offline) ============ */
async function supaRpc(fn, body){
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    },
    body: JSON.stringify(body || {})
  });
  if (!res.ok) throw new Error('Supabase ' + res.status + ': ' + await res.text().catch(() => ''));
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
function loadLocal(){
  try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; }
}
function saveLocal(list){
  try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e){}
}

let cloudOK = true;
async function loadAll(){
  try {
    const remote = await supaRpc('purrfect_load');
    if (Array.isArray(remote)){ saveLocal(remote); cloudOK = true; return remote; }
  } catch(e){ console.warn('Falha ao carregar do Supabase', e); cloudOK = false;
    const local0 = loadLocal();
    toast('Sem ligação à base de dados', (Array.isArray(local0) && local0.length) ? 'A mostrar a última cópia guardada neste aparelho.' : String(e.message || e).slice(0,80));
    return Array.isArray(local0) ? local0 : [];
  }
  const local = loadLocal();
  return Array.isArray(local) ? local : [];
}

let saveTimer = null;
function persist(){
  saveLocal(tasks);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await supaRpc('purrfect_save', { payload: tasks });
      cloudOK = true;
    } catch(e){
      console.warn('Falha ao sincronizar com o Supabase', e);
      if (cloudOK) toast('Sem ligação', 'Guardado neste aparelho — sincroniza quando a net voltar.');
      cloudOK = false;
    }
  }, 400);
}

/* ============ datas ============ */
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtLong(s){
  return parseYmd(s).toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});
}
function fmtWeekday(s){ return parseYmd(s).toLocaleDateString('pt-PT',{weekday:'long'}); }
function hhmm(min){ return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }

/* ============ recorrência ============ */
function occursOn(t, date){
  if (date < t.date) return false;
  if (t.until && date > t.until) return false;
  if (t.skip && t.skip.includes(date)) return false;
  const d = parseYmd(date), s = parseYmd(t.date);
  switch (t.repeat) {
    case 'daily':   return true;
    case 'weekly':  return (t.days && t.days.length) ? t.days.includes(d.getDay()) : d.getDay() === s.getDay();
    case 'monthly': return d.getDate() === s.getDate();
    case 'yearly':  return d.getDate() === s.getDate() && d.getMonth() === s.getMonth();
    default:        return date === t.date;
  }
}
function tasksOn(date, filter=true){
  return tasks
    .filter(t => t.kind !== 'routine' && t.kind !== 'birthday')
    .filter(t => occursOn(t, date))
    .filter(t => !filter || t.people.some(p => visible.has(p)))
    .sort((a,b) => toMin(a.time) - toMin(b.time));
}
const isDone = (t,date) => !!(t.done && t.done[date]);

  document.getElementById('monthLabel').textContent =

  const first = new Date(y,m,1);

/* ============ sobreposicoes ============ */
function pack(items){
  items.sort((a,b) => a.start - b.start || a.end - b.end);
  let group = [], groupEnd = -1;
  const flush = () => {
    const cols = [];
    group.forEach(it => { let c=0; while (c<cols.length && cols[c]>it.start) c++; it.col=c; cols[c]=it.end; });
    group.forEach(it => it.total = Math.max(1, cols.length));
    group = [];
  };
  items.forEach(it => {
    if (it.start >= groupEnd && group.length) flush();
    group.push(it); groupEnd = Math.max(groupEnd, it.end);
  });
  if (group.length) flush();
  return items;
}
function spineOf(people){
  const who = people.filter(p => P[p]);
  if (!who.length) return '#ccc';
  if (who.length === 1) return P[who[0]].color;
  return 'linear-gradient(180deg,' + who.map((p,i) =>
    P[p].color+' '+(i*100/who.length)+'% '+((i+1)*100/who.length)+'%').join(',') + ')';
}
function weekStartOf(date){ const d = parseYmd(date); return addDays(date, -((d.getDay()+6)%7)); }

/* ============ render: semana ============ */
function renderWeek(){
  const start = weekStartOf(selected);
  const days = Array.from({length:7}, (_,i) => addDays(start, i));
  const today = ymd(new Date());

  const a = parseYmd(days[0]), b = parseYmd(days[6]);
  const sameMonth = a.getMonth() === b.getMonth();
  document.getElementById('dayTitle').textContent = 'Semana de ' + a.getDate() +
    (sameMonth ? '' : ' ' + a.toLocaleDateString('pt-PT',{month:'short'})) + ' a ' + b.getDate() +
    ' ' + b.toLocaleDateString('pt-PT',{month:'long'});
  document.getElementById('daySub').textContent = b.getFullYear();

  // intervalo de horas mostrado
  let lo = 7*60, hi = 22*60;
  days.forEach(d => tasksOn(d).forEach(t => {
    const s = toMin(t.time);
    lo = Math.min(lo, Math.floor(s/60)*60);
    hi = Math.max(hi, Math.ceil(Math.min(1440, s + (t.duration||30))/60)*60);
  }));
  const rows = (hi - lo) / 30, H = rows * WSLOT + TOPPAD;

  const sc = document.getElementById('weekscroll_ref') || document.getElementById('weekView');
  const keepY = sc.scrollTop, keepX = sc.scrollLeft;
  const g = document.getElementById('wgrid');
  g.innerHTML = '';
  requestAnimationFrame(() => { sc.scrollTop = keepY; sc.scrollLeft = keepX; });

  const corner = document.createElement('div');
  corner.className = 'wh corner';
  g.appendChild(corner);

  const NAMES = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  days.forEach((d,i) => {
    const h2 = document.createElement('button');
    h2.className = 'wh' + (d===today ? ' wtoday':'') + (d===selected ? ' wsel':'') + (i>4 ? ' wend':'');
    h2.innerHTML = '<span class="wd">'+NAMES[i]+'</span><span class="wn">'+parseYmd(d).getDate()+'</span>';
    h2.addEventListener('click', () => { selected = d; setView('day'); });
    g.appendChild(h2);
  });

  if (days.some(d => bdaysOn(d).length)){
    const bg = document.createElement('div');
    bg.className = 'wband gut'; bg.innerHTML = CAKE.replace('viewBox','style="width:13px;height:13px" viewBox');
    g.appendChild(bg);
    days.forEach(d => {
      const c = document.createElement('div');
      c.className = 'wband';
      c.innerHTML = bdaysOn(d).map(b =>
        '<small style="color:'+catOf(b).color+';background:'+catOf(b).color+'1F">'+esc(b.title)+'</small>').join('');
      g.appendChild(c);
    });
  }

  const gut = document.createElement('div');
  gut.className = 'wgut';
  gut.style.height = H + 'px';
  for (let m = lo; m <= hi - 60; m += 60){
    const s = document.createElement('span');
    s.style.top = ((m - lo)/30*WSLOT + TOPPAD) + 'px';
    s.textContent = hhmm(m);
    gut.appendChild(s);
  }
  g.appendChild(gut);

  days.forEach((date,i) => {
    const col = document.createElement('div');
    col.className = 'wcol' + (i>4 ? ' wend':'') + (date===selected ? ' wselcol':'');
    col.style.height = H + 'px';
    col.style.backgroundPositionY = (TOPPAD - (lo%60)) + 'px';

    col.addEventListener('click', e => {
      if (e.target !== col) return;
      const y = e.clientY - col.getBoundingClientRect().top;
      const min = lo + Math.floor(Math.max(0, y - TOPPAD) / WSLOT) * 30;
      selected = date; renderAll();
      openSheet(null, hhmm(Math.max(0, Math.min(1410, min))));
    });

    const items = pack(tasksOn(date).map(t => {
      const s = toMin(t.time);
      return { t, start: s, end: Math.min(1440, s + (t.duration||30)) };
    }));

    items.forEach(it => {
      const t = it.t, done = isDone(t, date);
      const el = document.createElement('button');
      el.className = 'wev' + (done ? ' done':'');
      el.style.top = ((it.start - lo)/30*WSLOT + 1 + TOPPAD) + 'px';
      el.style.height = Math.max(20, (it.end - it.start)/30*WSLOT - 2) + 'px';
      el.style.left = 'calc(' + (it.col * (100/it.total)) + '% + 2px)';
      el.style.width = 'calc(' + (100/it.total) + '% - 5px)';
      el.innerHTML = '<span class="spine" style="background:'+spineOf(t.people)+'"></span>'+
        '<span class="wb"><span class="wt">'+t.time+'</span><span class="wn2">'+esc(t.title)+'</span></span>';
      el.title = t.title + ' · ' + t.people.map(p => P[p] ? P[p].name : p).join(', ');
      el.addEventListener('click', ev => { ev.stopPropagation(); selected = date; renderAll(); openSheet(t.id); });
      col.appendChild(el);
    });

    if (date === today){
      const n = new Date(), m = n.getHours()*60 + n.getMinutes();
      if (m >= lo && m <= hi){
        const line = document.createElement('div');
        line.className = 'wnow';
        line.style.top = ((m - lo)/30*WSLOT + TOPPAD) + 'px';
        col.appendChild(line);
      }
    }
    g.appendChild(col);
  });
}

/* ============ render: aniversários ============ */
function renderBirthdays(){
  const all = birthdays();

  const fil = document.getElementById('bdFilter');
  fil.innerHTML = '';
  [{id:'all', name:'Todos'}].concat(CATS).forEach(c => {
    const n = c.id === 'all' ? all.length : all.filter(b => (b.cat||'familia') === c.id).length;
    const b = document.createElement('button');
    b.className = 'opt';
    b.setAttribute('aria-pressed', bdCat === c.id);
    b.innerHTML = (c.id === 'all' ? '' : '<i style="background:'+c.color+'"></i>') +
                  c.name + (n ? ' · ' + n : '');
    b.addEventListener('click', () => { bdCat = c.id; renderBirthdays(); });
    fil.appendChild(b);
  });

  const box = document.getElementById('bdList');
  box.innerHTML = '';
  const list = all
    .filter(b => bdCat === 'all' || (b.cat||'familia') === bdCat)
    .map(b => ({ b, n: nextBday(b) }))
    .sort((x,y) => x.n.days - y.n.days);

  if (!list.length){
    box.innerHTML = '<div class="empty" style="padding:36px 20px 44px"><b>'+
      (all.length ? 'Nada nesta categoria' : 'Ainda não há aniversários')+'</b>'+
      (all.length ? 'Experimenta outra categoria ou acrescenta alguém aqui.'
                  : 'Adiciona os da família e dos amigos — repetem-se todos os anos sozinhos.')+'</div>';
    return;
  }

  list.forEach(({b,n}) => {
    const age = ageOn(b, n.year);
    const row = document.createElement('button');
    row.className = 'bdrow';
    row.innerHTML =
      '<span class="dt" style="color:'+catOf(b).color+'"><b>'+b.day+'</b>'+
        '<small style="color:inherit;opacity:.75">'+MONTHS[b.month-1]+'</small></span>'+
      '<span class="who2"><b>'+esc(b.title)+
        '<span class="bdtag" style="color:'+catOf(b).color+';border-color:'+catOf(b).color+'55'+
          ';background:'+catOf(b).color+'14">'+catOf(b).name+'</span></b>'+
        '<small>'+(age !== null ? 'Faz '+age+(age===1?' ano':' anos') : 'Idade desconhecida')+
        (b.notes ? ' · '+esc(b.notes) : '')+'</small></span>'+
      '<span class="cd'+(n.days<=7?' soon':'')+'" style="'+
        (n.days<=7 ? 'background:'+catOf(b).color+';color:#fff'
                   : 'color:'+catOf(b).color+';background:'+catOf(b).color+'1A')+'">'+
        (n.days===0 ? 'É hoje!' : n.days===1 ? 'Amanhã' : 'Faltam '+n.days+' dias')+'</span>';
    row.addEventListener('click', () => openSheet(b.id));
    box.appendChild(row);
  });

  document.querySelectorAll('#mainTabs .seg').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === s));
  document.getElementById('calWrap').classList.toggle('hidden', s !== 'cal');
  document.getElementById('ttWrap').classList.toggle('hidden', s !== 'tt');

function setView(v){
  view = v;
  document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-pressed', t.dataset.v === v));
  document.getElementById('weekView').classList.toggle('hidden', v !== 'week');
  document.getElementById('scroller').classList.toggle('hidden', v !== 'day');
  renderAll();
  if (v === 'day') scrollToRelevant();
}

/* ============ render: dia ============ */
const SLOT = 44;
function renderDay(){
  document.getElementById('dayTitle').textContent = fmtWeekday(selected);
  const d = parseYmd(selected);
  document.getElementById('daySub').textContent =
    d.toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'});

  const slots = document.getElementById('slots');
  if (slots.querySelectorAll('.slot').length === 0){
    for (let i=0;i<48;i++){
      const s = document.createElement('div');
      s.className = 'slot' + (i%2===0 ? ' hour':'');
      s.dataset.min = i*30;
      if (i%2===0){
        s.innerHTML = '<span class="tick hour">'+hhmm(i*30)+'</span>';
      } else {
        s.innerHTML = '<span class="whisker"></span>';
      }
      s.addEventListener('click', e => { if (e.target === s || e.target.parentElement === s) openSheet(null, hhmm(i*30)); });
      slots.insertBefore(s, document.getElementById('events'));
    }
  }

  const items = tasksOn(selected).map(t => {
    const start = toMin(t.time);
    return { t, start, end: Math.min(1440, start + (t.duration||30)) };
  });

  pack(items);

  const layer = document.getElementById('events');
  layer.innerHTML = '';
  items.forEach(it => {
    const t = it.t, done = isDone(t, selected);
    const h = Math.max(26, (it.end - it.start) / 30 * SLOT - 4);
    const el = document.createElement('button');
    el.className = 'ev' + (h < 40 ? ' short':'') + (done ? ' done':'');
    el.style.top = (it.start/30*SLOT + 2) + 'px';
    el.style.height = h + 'px';
    el.style.left = (it.col * (100/it.total)) + '%';
    el.style.width = 'calc('+(100/it.total)+'% - 4px)';

    const who = t.people.filter(p => P[p]);
    const stops = spineOf(t.people);

    el.innerHTML =
      '<span class="spine" style="background:'+stops+'"></span>'+
      '<span class="body">'+
        '<span class="t">'+t.time+' – '+hhmm(it.end % 1440)+
          (t.repeat && t.repeat!=='none' ? ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>':'')+
        '</span>'+
        '<span class="n">'+esc(t.title)+'</span>'+
        '<span class="who">'+who.map(p => '<i style="background:'+P[p].color+'">'+P[p].initial+'</i>').join('')+'</span>'+
      '</span>';

    el.addEventListener('click', ev => { ev.stopPropagation(); openSheet(t.id); });
    el.addEventListener('dblclick', ev => { ev.stopPropagation(); toggleDone(t); });
    el.title = (done ? 'Feita — ' : '') + t.title + ' · duplo clique para marcar como feita';
    layer.appendChild(el);
  });

  // linha do agora
  const old = document.querySelector('.now'); if (old) old.remove();
  if (selected === ymd(new Date())){
    const n = new Date();
    const line = document.createElement('div');
    line.className = 'now';
    line.style.top = ((n.getHours()*60 + n.getMinutes())/30*SLOT) + 'px';
    document.getElementById('slots').appendChild(line);
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderAll(){
  const sd = parseYmd(selected);
  if (sd.getMonth() !== cursor.getMonth() || sd.getFullYear() !== cursor.getFullYear()) cursor = new Date(sd);
  renderPeople();
  document.getElementById('peopleBar').classList.toggle('hidden', section === 'bd');
  if (section === 'tt'){ renderTimetable(); return; }
  if (section === 'bd'){ renderBirthdays(); return; }
  renderMonth(); renderDayBand();
  if (view === 'week') renderWeek(); else renderDay();
  document.getElementById('emptyState').classList.toggle('hidden', view !== 'day' || tasksOn(selected).length > 0);
}

function toggleDone(t){
  t.done = t.done || {};
  t.done[selected] ? delete t.done[selected] : t.done[selected] = true;
  persist(); renderDay();
}

/* ============ folha de edição ============ */
const veil = document.getElementById('veil');

function openSheet(id, presetTime, opts){
  editingId = id;
  const t = id ? tasks.find(x => x.id === id) : null;
  const wanted = t ? t.kind : (opts && opts.kind);
  const bday = wanted === 'birthday';
  const routine = wanted === 'routine';
  if (bday){
    draft = t ? JSON.parse(JSON.stringify(t))
              : { kind:'birthday', title:'', month:new Date().getMonth()+1, day:new Date().getDate(),
                  year:new Date().getFullYear()-30, cat:'familia', notes:'' };
    draft.kind = 'birthday';
    draft.people = draft.people || [];
    draft.days = draft.days || [];
    draft.repeat = draft.repeat || 'none';
    draft.cat = draft.cat || 'familia';
    document.getElementById('sheetTitle').textContent = t ? 'Editar aniversário' : 'Novo aniversário';
    document.getElementById('fDelete').classList.toggle('hidden', !t);
    document.getElementById('fTitle').value = draft.title;
    document.getElementById('fDate').value =
      (draft.year || 2000) + '-' + String(draft.month).padStart(2,'0') + '-' + String(draft.day).padStart(2,'0');
    document.getElementById('fNotes').value = draft.notes || '';
    syncSheet();
    veil.hidden = false;
    document.body.style.overflow = 'hidden';
    setTimeout(() => document.getElementById('fTitle').focus(), 60);
    return;
  }
  draft = t ? JSON.parse(JSON.stringify(t)) : (routine ? {
    kind:'routine', title:'', people:[], date:ROUTINE_DATE, time:presetTime || defaultTime(),
    duration:30, repeat:'weekly', days:[(opts && opts.day != null) ? opts.day : 1], until:'', notes:''
  } : {
    title:'', people:[], date:selected, time:presetTime || defaultTime(),
    duration:30, repeat:'none', days:[], until:'', notes:''
  });
  draft.kind = routine ? 'routine' : 'task';
  document.getElementById('sheetTitle').textContent =
    routine ? (t ? 'Editar bloco do horário' : 'Novo bloco do horário')
            : (t ? 'Editar tarefa' : 'Nova tarefa');
  document.getElementById('fDelete').classList.toggle('hidden', !t);
  document.getElementById('fTitle').value = draft.title;
  document.getElementById('fDate').value = draft.date;
  document.getElementById('fTime').value = draft.time;
  document.getElementById('fDur').value = String(draft.duration);
  document.getElementById('fUntil').value = draft.until || '';
  document.getElementById('fNotes').value = draft.notes || '';
  syncSheet();
  veil.hidden = false;
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('fTitle').focus(), 60);
}
function closeSheet(){ veil.hidden = true; document.body.style.overflow = ''; editingId = null; }

function defaultTime(){
  const n = new Date(); let m = n.getHours()*60 + n.getMinutes();
  m = Math.ceil(m/30)*30; if (m > 1410) m = 1410;
  return hhmm(m);
}

function syncSheet(){
  document.querySelectorAll('#fPeople .chip').forEach(c =>
    c.setAttribute('aria-pressed', (draft.people||[]).includes(c.dataset.p)));
  document.querySelectorAll('#fRepeat .opt').forEach(o =>
    o.setAttribute('aria-pressed', draft.repeat === o.dataset.v));
  document.querySelectorAll('#fDays .opt').forEach(o =>
    o.setAttribute('aria-pressed', (draft.days||[]).includes(Number(o.dataset.d))));
  const routine = draft.kind === 'routine';
  const bday = draft.kind === 'birthday';
  document.getElementById('fNoYear').setAttribute('aria-pressed', bday && !draft.year);
  document.getElementById('fTitle').placeholder = bday ? 'Ex.: Avó Teresa' : 'Ex.: Buscar a Alice ao ballet';
  document.getElementById('fDateLabel').textContent = bday ? 'Data de nascimento' : 'Data';
  document.getElementById('fDateWrap').classList.toggle('hidden', routine);
  document.getElementById('fTimeWrap').classList.toggle('hidden', bday);
  document.getElementById('fDurWrap').classList.toggle('hidden', bday);
  document.getElementById('fPeopleWrap').classList.toggle('hidden', bday);
  document.querySelectorAll('#fCat .opt').forEach(c =>
    c.setAttribute('aria-pressed', (draft.cat||'familia') === c.dataset.c));
  document.getElementById('fCatWrap').classList.toggle('hidden', !bday);
  document.getElementById('fYearWrap').classList.toggle('hidden', !bday);
  document.getElementById('fRepeatWrap').classList.toggle('hidden', routine || bday);
  document.getElementById('fDaysWrap').classList.toggle('hidden', bday || (!routine && draft.repeat !== 'weekly'));
  document.getElementById('fDaysLabel').textContent = routine ? 'Dias da semana' : 'Em que dias';
  document.getElementById('fUntilWrap').classList.toggle('hidden', routine || bday || draft.repeat === 'none');
}

// preencher selectores
(function initSheet(){
  const chips = document.getElementById('fPeople');
  PEOPLE.forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.p = p.id;
    b.innerHTML = '<span class="av" style="background:'+p.color+'">'+p.initial+'</span>'+p.name;
    b.addEventListener('click', () => {
      draft.people = draft.people || [];
      const i = draft.people.indexOf(p.id);
      i < 0 ? draft.people.push(p.id) : draft.people.splice(i,1);
      syncSheet();
    });
    chips.appendChild(b);
  });

  const sel = document.getElementById('fTime');
  for (let i=0;i<48;i++){
    const o = document.createElement('option');
    o.value = hhmm(i*30); o.textContent = hhmm(i*30);
    sel.appendChild(o);
  }

  document.querySelectorAll('#fRepeat .opt').forEach(o =>
    o.addEventListener('click', () => {
      draft.repeat = o.dataset.v;
      draft.days = draft.days || [];
      if (draft.repeat === 'weekly' && !draft.days.length)
        draft.days = [parseYmd(document.getElementById('fDate').value || draft.date).getDay()];
      syncSheet();
    }));
  document.querySelectorAll('#fDays .opt').forEach(o =>
    o.addEventListener('click', () => {
      draft.days = draft.days || [];
      const d = Number(o.dataset.d), i = draft.days.indexOf(d);
      i < 0 ? draft.days.push(d) : draft.days.splice(i,1);
      syncSheet();
    }));
  document.getElementById('fDate').addEventListener('change', e => draft.date = e.target.value);
  document.querySelectorAll('#fCat .opt').forEach(c =>
    c.addEventListener('click', () => { draft.cat = c.dataset.c; syncSheet(); }));
  document.getElementById('fNoYear').addEventListener('click', () => {
    draft.year = draft.year ? null : (Number(document.getElementById('fDate').value.slice(0,4)) || 1990);
    syncSheet();
  });
})();

document.getElementById('fSave').addEventListener('click', () => {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { toast('Falta o nome', 'Escreve o que é para fazer.'); document.getElementById('fTitle').focus(); return; }
  if (draft.kind !== 'birthday' && !(draft.people||[]).length) { toast('Falta escolher quem', 'Seleciona a Catarina, o Pedro e/ou a Alice.'); return; }

  if (draft.kind === 'birthday'){
    const v = document.getElementById('fDate').value;
    if (!v) { toast('Falta a data', 'Escolhe o dia do aniversário.'); return; }
    const [yy,mm,dd] = v.split('-').map(Number);
    const bd = {
      id: editingId || ('b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
      kind:'birthday', title, month:mm, day:dd, cat: draft.cat || 'familia',
      year: draft.year ? yy : null,
      notes: document.getElementById('fNotes').value.trim()
    };
    if (editingId) tasks = tasks.map(t => t.id === editingId ? bd : t);
    else tasks.push(bd);
    persist(); closeSheet(); renderAll();
    toast('Aniversário guardado', bd.title + ' · ' + bd.day + ' ' + MONTHS[bd.month-1]);
    return;
  }

  const routine = draft.kind === 'routine';
  if (routine && !(draft.days||[]).length) { toast('Falta o dia', 'Escolhe pelo menos um dia da semana.'); return; }

  const data = {
    id: editingId || ('t' + Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
    kind: routine ? 'routine' : 'task',
    title,
    people: draft.people.slice(),
    date: routine ? ROUTINE_DATE : (document.getElementById('fDate').value || selected),
    time: document.getElementById('fTime').value,
    duration: Number(document.getElementById('fDur').value),
    repeat: routine ? 'weekly' : draft.repeat,
    days: (routine || draft.repeat === 'weekly') ? draft.days.slice() : [],
    until: (routine || draft.repeat === 'none') ? '' : (document.getElementById('fUntil').value || ''),
    notes: document.getElementById('fNotes').value.trim(),
    done: (editingId && tasks.find(t => t.id === editingId)?.done) || {},
    skip: (editingId && tasks.find(t => t.id === editingId)?.skip) || []
  };

  if (editingId) tasks = tasks.map(t => t.id === editingId ? data : t);
  else tasks.push(data);

  persist();
  if (!routine) selected = data.date;
  closeSheet();
  renderAll();
  toast(routine ? 'Bloco guardado' : 'Tarefa guardada',
        data.title + ' · ' + (routine ? data.days.map(d => DAYNAMES[DOW.indexOf(d)]).join(', ') + ' ' : '') + data.time);
});

document.getElementById('fDelete').addEventListener('click', () => {
  const t = tasks.find(x => x.id === editingId);
  if (!t) return;
  if (t.kind === 'routine' || t.kind === 'birthday') {
    tasks = tasks.filter(x => x.id !== editingId);
  } else if (t.repeat && t.repeat !== 'none') {
    const only = confirm('Esta tarefa repete-se.\n\nOK = eliminar só o dia ' + selected +
                         '\nCancelar = eliminar toda a série');
    if (only) { t.skip = t.skip || []; t.skip.push(selected); }
    else tasks = tasks.filter(x => x.id !== editingId);
  } else {
    tasks = tasks.filter(x => x.id !== editingId);
  }
  persist(); closeSheet(); renderAll();
  toast('Tarefa eliminada', t.title);
});

document.getElementById('closeSheet').addEventListener('click', closeSheet);
veil.addEventListener('click', e => { if (e.target === veil) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !veil.hidden) closeSheet(); });

/* ============ avisos no ecrã ============ */
function toast(title, body){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>'+
                 '<span><b>'+esc(title)+'</b><small>'+esc(body)+'</small></span>';
  el.addEventListener('click', () => el.remove());
  box.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* ============ navegação ============ */
document.getElementById('prevM').addEventListener('click', () => { cursor.setMonth(cursor.getMonth()-1); renderMonth(); });
document.getElementById('nextM').addEventListener('click', () => { cursor.setMonth(cursor.getMonth()+1); renderMonth(); });
document.querySelectorAll('#tabs .tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.v)));
document.getElementById('goPrev').addEventListener('click', () => { selected = addDays(selected, view==='week' ? -7 : -1); renderAll(); if (view==='day') scrollToRelevant(); });
document.getElementById('goNext').addEventListener('click', () => { selected = addDays(selected, view==='week' ?  7 :  1); renderAll(); if (view==='day') scrollToRelevant(); });
document.getElementById('todayBtn').addEventListener('click', () => { selected = ymd(new Date()); cursor = new Date(); renderAll(); scrollToRelevant(); });
document.getElementById('fab').addEventListener('click', () =>
  openSheet(null, null,
    section === 'tt' ? { kind:'routine', day:(new Date().getDay()) } :
    section === 'bd' ? { kind:'birthday' } : null));
document.querySelectorAll('#mainTabs .seg').forEach(b =>
  b.addEventListener('click', () => setSection(b.dataset.v)));

function scrollToRelevant(){
  const items = tasksOn(selected);
  let min = items.length ? toMin(items[0].time) : (selected === ymd(new Date()) ? new Date().getHours()*60 : 8*60);
  document.getElementById('scroller').scrollTop = Math.max(0, min/30*SLOT - 80);
}

/* ============ arranque ============ */
(async function start(){
  tasks = await loadAll();
  renderAll();
  scrollToRelevant();
  document.getElementById('ttScroll').scrollTop = 0;
  setInterval(() => { if (view === 'week' || selected === ymd(new Date())) renderAll(); }, 60000);
})();

</script>
